<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#0d1824"/>
      <stop offset="1" stop-color="#070b10"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8ecdf5"/>
      <stop offset="1" stop-color="#5a9bc4"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- top rule + brand -->
  <rect x="72" y="64" width="56" height="6" fill="url(#bar)"/>
  <text x="144" y="78" font-family="'JetBrainsMonoNL Nerd Font', monospace" font-size="26" font-weight="700" fill="#8ecdf5" letter-spacing="6">QBOT4K</text>

  <!-- headline -->
  <text x="72" y="238" font-family="'Noto Sans', 'Liberation Sans', sans-serif" font-size="74" font-weight="700" fill="#f5f8fb">The first real</text>
  <text x="72" y="326" font-family="'Noto Sans', 'Liberation Sans', sans-serif" font-size="74" font-weight="700" fill="#8ecdf5">community intelligence</text>
  <text x="72" y="414" font-family="'Noto Sans', 'Liberation Sans', sans-serif" font-size="74" font-weight="700" fill="#f5f8fb">platform for streamers</text>

  <!-- subline -->
  <text x="72" y="500" font-family="'Noto Sans', 'Liberation Sans', sans-serif" font-size="30" fill="#aab7c3">Moderation command · explainable signals · live ops</text>

  <!-- footer chips -->
  <g font-family="'JetBrainsMonoNL Nerd Font', monospace" font-size="20" font-weight="700">
    <rect x="72" y="540" width="150" height="40" rx="4" fill="none" stroke="#29394a" stroke-width="1.5"/>
    <text x="96" y="566" fill="#8ecdf5">DISCORD</text>
    <rect x="238" y="540" width="130" height="40" rx="4" fill="none" stroke="#29394a" stroke-width="1.5"/>
    <text x="262" y="566" fill="#8ecdf5">TWITCH</text>
    <text x="404" y="566" fill="#5b6b78" font-weight="400">evidence before action</text>
  </g>

  <!-- corner signal bars -->
  <g fill="#8ecdf5">
    <rect x="1080" y="66" width="10" height="24" opacity="0.35"/>
    <rect x="1098" y="56" width="10" height="34" opacity="0.55"/>
    <rect x="1116" y="46" width="10" height="44" opacity="0.75"/>
    <rect x="1134" y="36" width="10" height="54"/>
  </g>
</svg>
