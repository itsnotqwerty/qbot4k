name: Port contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.4
      - name: Install locked Deno dependencies
        run: deno install --frozen
      - name: Check Deno runtime
        run: deno task check

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.4
      - name: Install locked Deno dependencies
        run: deno install --frozen
      - name: Install Chromium
        run: deno run -A npm:playwright@1.62.1 install --with-deps chromium
      - name: Run browser tests
        run: deno task browser

  postgresql-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: qbot4k-test
          POSTGRES_DB: qbot4k
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d qbot4k"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.4
      - name: Install locked Deno dependencies
        run: deno install --frozen
      - name: Run PostgreSQL integration gates
        env:
          QBOT_TEST_POSTGRES_URL: postgresql://postgres:qbot4k-test@127.0.0.1:5432/qbot4k
        run: deno task test:ownership
