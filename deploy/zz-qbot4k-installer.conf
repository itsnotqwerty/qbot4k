# Installer-owned final overrides. The zz- prefix ensures these resets are
# applied after legacy override.conf files left by earlier installations.
[Service]
WorkingDirectory=/var/lib/qbot4k

ExecStart=
ExecStart=/opt/qbot4k/current/.venv/bin/python /opt/qbot4k/current/src/__main__.py --env-file /etc/qbot4k/qbot4k.env run

ReadWritePaths=
ReadWritePaths=/opt/qbot4k/data /var/lib/qbot4k /var/backups/qbot4k
